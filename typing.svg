<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <style>
    .hand-l { animation: typeL 0.4s ease-in-out infinite alternate; }
    .hand-r { animation: typeR 0.4s ease-in-out infinite alternate 0.2s; }
    .steam { animation: rise 2s ease-out infinite; }
    .steam2 { animation: rise 2s ease-out infinite 1s; }
    .glow { animation: pulse 3s ease-in-out infinite; }

    @keyframes typeL { 0% { transform: translateY(0); } 100% { transform: translateY(3px); } }
    @keyframes typeR { 0% { transform: translateY(0); } 100% { transform: translateY(3px); } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0.6; } 100% { transform: translateY(-14px); opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.7; } }
  </style>

  <!-- Background -->
  <rect width="400" height="300" fill="#1e1e2e" rx="12"/>

  <!-- Desk -->
  <rect x="40" y="230" width="320" height="12" fill="#5c4d3c" rx="3"/>
  <rect x="60" y="242" width="10" height="48" fill="#4a3d2f"/>
  <rect x="330" y="242" width="10" height="48" fill="#4a3d2f"/>

  <!-- Person (behind laptop) -->
  <!-- Head -->
  <circle cx="200" cy="130" r="26" fill="#f0c8a0"/>
  <!-- Hair -->
  <path d="M174 122 Q176 100 200 98 Q224 100 226 122" fill="#3a2a1a"/>
  <!-- Eyes -->
  <circle cx="192" cy="130" r="2.5" fill="#333"/>
  <circle cx="208" cy="130" r="2.5" fill="#333"/>
  <!-- Eyebrows -->
  <line x1="188" y1="124" x2="196" y2="123" stroke="#3a2a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="204" y1="123" x2="212" y2="124" stroke="#3a2a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth (focused) -->
  <line x1="196" y1="142" x2="204" y2="142" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ears -->
  <circle cx="174" cy="132" r="4" fill="#e8b88a"/>
  <circle cx="226" cy="132" r="4" fill="#e8b88a"/>

  <!-- Neck -->
  <rect x="194" y="155" width="12" height="12" fill="#f0c8a0"/>

  <!-- Shoulders / torso -->
  <path d="M160 167 Q165 160 200 158 Q235 160 240 167 L240 200 L160 200 Z" fill="#4a90d9" rx="8"/>

  <!-- Arms reaching to keyboard -->
  <path d="M165 180 Q150 200 155 218" stroke="#f0c8a0" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M235 180 Q250 200 245 218" stroke="#f0c8a0" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Hands (animated) -->
  <ellipse class="hand-l" cx="155" cy="222" rx="7" ry="5" fill="#f0c8a0"/>
  <ellipse class="hand-r" cx="245" cy="222" rx="7" ry="5" fill="#f0c8a0"/>

  <!-- Laptop (back of lid facing us) -->
  <!-- Lid (back) -->
  <rect x="130" y="185" width="140" height="45" fill="#2d2d3d" rx="4"/>
  <!-- Lid edge highlight -->
  <rect x="130" y="185" width="140" height="3" fill="#3a3a4d" rx="2"/>
  <!-- Logo on back of lid -->
  <circle class="glow" cx="200" cy="207" r="8" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <!-- Hinge -->
  <rect x="130" y="228" width="140" height="4" fill="#1a1a2a" rx="2"/>

  <!-- Keyboard deck (visible below hinge) -->
  <rect x="125" y="230" width="150" height="10" fill="#3a3a4a" rx="3"/>
  <!-- Key rows (subtle) -->
  <rect x="135" y="233" width="130" height="2" fill="#4a4a5a" rx="1"/>
  <rect x="140" y="236" width="120" height="2" fill="#4a4a5a" rx="1"/>

  <!-- Trackpad -->
  <rect x="180" y="240" width="40" height="5" fill="#2a2a3a" rx="2"/>

  <!-- Coffee mug -->
  <rect x="310" y="210" width="20" height="22" fill="#c0392b" rx="3"/>
  <path d="M330 215 Q338 220 330 225" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <!-- Steam -->
  <circle class="steam" cx="318" cy="205" r="3" fill="none" stroke="#aaa" stroke-width="1"/>
  <circle class="steam2" cx="324" cy="203" r="2" fill="none" stroke="#aaa" stroke-width="1"/>

  <!-- Ambient glow from screen (hitting person's face) -->
  <ellipse class="glow" cx="200" cy="160" rx="35" ry="20" fill="#7ec8e3" opacity="0.08"/>
</svg>   
